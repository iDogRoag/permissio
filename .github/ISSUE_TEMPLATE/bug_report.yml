name: Bug report
description: Report incorrect output or a CLI problem.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow snippet
      description: Include the smallest workflow snippet that reproduces the issue.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: permissio version
      placeholder: "Output of permissio --version"
    validations:
      required: false
