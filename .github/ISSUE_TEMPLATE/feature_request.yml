name: Feature request
description: Suggest a new rule, reporter, or CLI option.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should permissio help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example workflows or actions
      render: yaml
    validations:
      required: false
